<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verificador de Idade</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="main">

        <section class="verificador">

            <div class="container">

                <div class="titulo">
                    <h1>Verificador de Idade</h1>
                </div>

                <div class="formulario-campo">

                    <form class="formulario" id="formulario">
                        <input type="text" id="campoIdade" name="idade" placeholder="Digite sua idade" min="0"
                            required>
                        <button type="submit" onclick="verificarIdade()">Enviar</button>
                    </form>
                </div>

                <div class="resultadoDiv">
                    <p id="resultado">Digite sua idade para verificar a autorização.</p>
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
