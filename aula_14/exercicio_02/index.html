<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <div class="titulo">
                <h1>Sistema Escolar</h1>
            </div>
            
            <div class="formulario-campo">
                <div class="formulario">
                    <input type="text" id="nota1" placeholder="Primeira nota"><br>
                    <input type="text" id="nota2" placeholder="Segunda nota"><br>
                    <input type="text" id="nota3" placeholder="Terceira nota"><br>
                    <input type="text" id="nota4" placeholder="Quarta nota"><br>
                    <button onclick="calcularMedia()">Verificar Média</button>
                </div>
            </div>

            <div class="resultado">
                <p id="resultado">Digite as notas para saber a média.</p>
            </div>

        </div>
        
    </main>
</body>
    <script src="script.js"></script>
</html>
